name: Build & Release APK

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Ensure gradlew is executable
        run: chmod +x gradlew

      # Barrière : les tests unitaires doivent passer AVANT tout build/release.
      - name: Run unit tests
        run: ./gradlew test

      # Lint mesuré mais NON bloquant sur ce lot (abortOnError = false) ;
      # le rapport est publié en artifact pour analyse.
      - name: Lint (release)
        run: ./gradlew lintRelease

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-release-report
          path: |
            app/build/reports/lint-results-release.html
            app/build/reports/lint-results-release.xml
          if-no-files-found: warn

      - name: Decode keystore
        run: echo "${{ secrets.KEYSTORE_B64 }}" | base64 -d > release-keystore.jks

      - name: Build signed release APK
        env:
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
          KEY_PASS: ${{ secrets.KEY_PASS }}
        run: |
          ./gradlew assembleRelease \
            -PversionCode=${{ github.run_number }} \
            -PversionName=1.1.${{ github.run_number }} \
            -Pandroid.injected.signing.store.file=$(pwd)/release-keystore.jks \
            -Pandroid.injected.signing.store.password=$KEYSTORE_PASS \
            -Pandroid.injected.signing.key.alias=registre-release \
            -Pandroid.injected.signing.key.password=$KEY_PASS

      # Garde permanente hors-ligne : porte sur le manifest MERGÉ (app + libs),
      # là où une permission arriverait par manifest merge d'une dépendance.
      # LISTE BLANCHE : toute permission mergée hors de
      # .github/permissions-allowlist.txt fait échouer le build. INTERNET reste
      # refusée explicitement, même si elle figurait dans la liste.
      - name: Vérifier l'absence de réseau (liste blanche de permissions)
        run: |
          MERGED=$(find app/build/intermediates -path '*merged_manifest*release*' -name AndroidManifest.xml | head -1)
          test -n "$MERGED" || { echo "Manifest mergé introuvable"; exit 1; }
          echo "Manifest mergé : $MERGED"

          ALLOWLIST=.github/permissions-allowlist.txt
          test -f "$ALLOWLIST" || { echo "Liste blanche introuvable : $ALLOWLIST"; exit 1; }

          # INTERNET refusée explicitement — dans le manifest ET dans la liste.
          if grep -q "android.permission.INTERNET" "$MERGED"; then
            echo "ÉCHEC : permission INTERNET détectée dans le manifest mergé"; exit 1;
          fi
          if grep -qE '^[[:space:]]*android\.permission\.INTERNET[[:space:]]*$' "$ALLOWLIST"; then
            echo "ÉCHEC : INTERNET ne peut PAS figurer dans la liste blanche"; exit 1;
          fi

          # Liste blanche normalisée : sans commentaires ni lignes vides,
          # espaces retirés PAR LIGNE (les sauts de ligne sont préservés).
          ALLOWED=$(grep -vE '^[[:space:]]*(#|$)' "$ALLOWLIST" | sed -E 's/[[:space:]]//g' | sort -u)

          # Toutes les uses-permission réellement présentes dans le manifest mergé.
          PRESENT=$(grep -oE '<uses-permission[^>]*android:name="[^"]+"' "$MERGED" \
            | sed -E 's/.*android:name="([^"]+)".*/\1/' | sort -u)

          echo "Permissions présentes dans le manifest mergé :"
          echo "$PRESENT" | sed 's/^/  - /'

          HORS_LISTE=0
          for perm in $PRESENT; do
            if ! printf '%s\n' "$ALLOWED" | grep -qxF "$perm"; then
              echo "ÉCHEC : permission hors liste blanche : $perm"
              HORS_LISTE=1
            fi
          done
          if [ "$HORS_LISTE" -ne 0 ]; then
            echo "→ Ajoute la permission à $ALLOWLIST (avec sa justification) ou retire-la."
            exit 1
          fi

          if grep -rqiE "okhttp|retrofit|ktor-client" app/build.gradle.kts; then
            echo "ÉCHEC : dépendance réseau détectée"; exit 1;
          fi
          echo "OK : aucune permission hors liste blanche, aucune INTERNET, aucune dépendance réseau."

      - name: Get build tag
        id: version
        run: echo "tag=build-$(date +%Y%m%d-%H%M%S)" >> "$GITHUB_OUTPUT"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          files: app/build/outputs/apk/release/app-release.apk

      - name: Clean up keystore
        if: always()
        run: rm -f release-keystore.jks
