name: Build & Release APK

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Ensure gradlew is executable
        run: chmod +x gradlew

      # Barrière : les tests unitaires doivent passer AVANT tout build/release.
      - name: Run unit tests
        run: ./gradlew test

      # Lint mesuré mais NON bloquant sur ce lot (abortOnError = false) ;
      # le rapport est publié en artifact pour analyse.
      - name: Lint (release)
        run: ./gradlew lintRelease

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-release-report
          path: |
            app/build/reports/lint-results-release.html
            app/build/reports/lint-results-release.xml
          if-no-files-found: warn

      - name: Decode keystore
        run: echo "${{ secrets.KEYSTORE_B64 }}" | base64 -d > release-keystore.jks

      - name: Build signed release APK
        env:
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
          KEY_PASS: ${{ secrets.KEY_PASS }}
        run: |
          ./gradlew assembleRelease \
            -PversionCode=${{ github.run_number }} \
            -PversionName=1.1.${{ github.run_number }} \
            -Pandroid.injected.signing.store.file=$(pwd)/release-keystore.jks \
            -Pandroid.injected.signing.store.password=$KEYSTORE_PASS \
            -Pandroid.injected.signing.key.alias=registre-release \
            -Pandroid.injected.signing.key.password=$KEY_PASS

      # Garde permanente hors-ligne : porte sur le manifest MERGÉ (app + libs),
      # là où une permission INTERNET arriverait par manifest merge d'une dépendance.
      - name: Vérifier l'absence de réseau (manifest mergé)
        run: |
          MERGED=$(find app/build/intermediates -path '*merged_manifest*release*' -name AndroidManifest.xml | head -1)
          test -n "$MERGED" || { echo "Manifest mergé introuvable"; exit 1; }
          echo "Manifest mergé : $MERGED"
          if grep -q "android.permission.INTERNET" "$MERGED"; then
            echo "ÉCHEC : permission INTERNET détectée dans le manifest mergé"; exit 1;
          fi
          if grep -rqiE "okhttp|retrofit|ktor-client" app/build.gradle.kts; then
            echo "ÉCHEC : dépendance réseau détectée"; exit 1;
          fi
          echo "OK : aucune permission INTERNET, aucune dépendance réseau."

      - name: Get build tag
        id: version
        run: echo "tag=build-$(date +%Y%m%d-%H%M%S)" >> "$GITHUB_OUTPUT"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          files: app/build/outputs/apk/release/app-release.apk

      - name: Clean up keystore
        if: always()
        run: rm -f release-keystore.jks
